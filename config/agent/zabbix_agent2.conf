# ==========================================================================
#  Zabbix Agent 2 - configuracion comun de los hosts monitoreados
#  (se monta como volumen en /etc/zabbix/zabbix_agent2.conf)
# ==========================================================================
LogType=console
DebugLevel=3
PidFile=/run/zabbix/zabbix_agent2.pid
ControlSocket=/run/zabbix/agent.sock

# Chequeos pasivos: solo acepta peticiones de la red del laboratorio (donde esta el Zabbix Server)
Server=172.28.0.0/24
ListenPort=10050

# El nombre del host es el hostname del contenedor (lab-web, lab-db, lab-dns, lab-ftp)
HostnameItem=system.hostname

Timeout=10

# Metricas propias (cgroup del contenedor, etc.)
Include=/etc/zabbix/zabbix_agent2.d/*.conf
