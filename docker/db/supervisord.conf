[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:mysqld]
command=docker-entrypoint.sh mysqld --performance-schema=OFF --innodb-buffer-pool-size=64M --max-connections=50
autorestart=true
priority=10
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:zabbix-agent2]
command=/usr/sbin/zabbix_agent2 -f -c /etc/zabbix/zabbix_agent2.conf
user=zabbix
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Permite administrar los procesos con:  supervisorctl -c /etc/supervisor/lab-supervisord.conf stop|start <programa>
[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock
