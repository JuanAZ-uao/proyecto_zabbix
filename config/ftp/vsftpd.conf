# vsftpd del laboratorio (montado como volumen)
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
seccomp_sandbox=NO
# Modo pasivo con rango fijo
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
# Log en archivo (vsftpd abre el log con O_NOFOLLOW y falla con 500 OOPS si se le pasa /dev/stdout);
# supervisord lo reenvia a la salida del contenedor con "tail -F" (docker logs lab-ftp).
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES
