# Metricas por contenedor leidas del cgroup v2 (ver lab-cgroup.sh)
#   lab.cg[cpu_pct]   % de CPU respecto al limite del contenedor
#   lab.cg[mem_used]  bytes de memoria en uso (sin cache inactiva)
#   lab.cg[mem_limit] limite de memoria en bytes
#   lab.cg[mem_pct]   % de memoria respecto al limite
#   lab.cg[pids]      numero de procesos/hilos del contenedor
UserParameter=lab.cg[*],sh /usr/local/bin/lab-cgroup.sh $1
