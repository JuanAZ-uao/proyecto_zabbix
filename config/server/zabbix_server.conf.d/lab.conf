# ==========================================================================
#  Ajustes del Zabbix Server para el laboratorio (se montan como volumen)
#  Se incluyen desde zabbix_server.conf mediante Include=...zabbix_server.conf.d/*.conf
#  Objetivo: detectar caidas rapido (para medir el tiempo de deteccion) sin
#  sobrecargar la maquina.
# ==========================================================================
StartPingers=5
StartPollers=8
StartPollersUnreachable=3
Timeout=10
# Un host sin respuesta se marca "no disponible" a los 30 s y se reintenta cada 10 s
UnreachablePeriod=30
UnreachableDelay=10
UnavailableDelay=20
LogSlowQueries=3000
